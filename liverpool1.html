<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anfield Chronicles | CSS-Driven LFC Experience</title>
  <style>
    /* =========================================
       1. CSS VARIABLES & THEME ARCHITECTURE
       ========================================= */
    :root {
      --red-primary: #c8102e;
      --red-deep: #7a0619;
      --red-glow: rgba(200, 16, 46, 0.55);
      --gold: #f6eb61;
      --teal: #00b2a9;
      --bg-base: #0b0c0e;
      --surface-glass: rgba(24, 27, 32, 0.72);
      --border-glass: rgba(255, 255, 255, 0.12);
      --text-main: #f8f9fa;
      --text-dim: #9ba3af;
      --pitch-green: #14532d;
      --pitch-stripe: #166534;
    }

    /* Alternate "Away Kit" Theme toggled via JS */
    body.away-theme {
      --red-primary: #00b2a9;
      --red-deep: #005f5a;
      --red-glow: rgba(0, 178, 169, 0.45);
      --gold: #f6eb61;
    }

    /* =========================================
       2. RESET, SCROLLBAR & TYPOGRAPHY
       ========================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--red-primary) var(--bg-base);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 15% 10%, var(--red-glow), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(246, 235, 97, 0.08), transparent 40%);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background 0.4s ease;
    }

    /* =========================================
       3. GLASSMORPHISM HEADER & ANIMATED BADGE
       ========================================= */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(11, 12, 14, 0.8);
      border-bottom: 1px solid var(--border-glass);
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: 1.5px;
    }

    .crest-pulse {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--red-primary);
      box-shadow: 0 0 0 0 var(--red-glow);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--red-glow); }
      70% { box-shadow: 0 0 0 12px rgba(200, 16, 46, 0); }
      100% { box-shadow: 0 0 0 0 rgba(200, 16, 46, 0); }
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      position: relative;
      padding-bottom: 4px;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--gold);
      transition: width 0.3s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .kit-toggle {
      background: linear-gradient(135deg, var(--red-primary), var(--red-deep));
      color: white;
      border: 1px solid var(--border-glass);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .kit-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px var(--red-glow);
    }

    /* =========================================
       4. HERO BANNER WITH SHIMMER TYPOGRAPHY
       ========================================= */
    .hero {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 4rem 1.5rem;
      position: relative;
    }

    .hero-tag {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 0.8rem;
      color: var(--gold);
      border: 1px solid rgba(246, 235, 97, 0.3);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 1.2rem;
      background: rgba(246, 235, 97, 0.05);
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.8rem);
      font-weight: 900;
      line-height: 1.1;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff 0%, var(--gold) 50%, #ffffff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 5s linear infinite;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    .hero p {
      max-width: 620px;
      color: var(--text-dim);
      margin-top: 1rem;
      font-size: 1.1rem;
    }

    /* =========================================
       5. LAYOUT CONTAINER & SECTION HEADINGS
       ========================================= */
    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 2rem 1.5rem 5rem;
    }

    section {
      margin-bottom: 5rem;
    }

    .section-header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 0.8rem;
    }

    .section-header h2 {
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .section-header span {
      color: var(--gold);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* =========================================
       6. 3D FLIP CARDS (CLUB LEGENDS - PURE CSS)
       ========================================= */
    .legends-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      perspective: 1200px;
    }

    .flip-card {
      height: 300px;
      cursor: pointer;
    }

    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.75s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flip-card:hover .flip-inner {
      transform: rotateY(180deg);
    }

    .flip-front, .flip-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 16px;
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--border-glass);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .flip-front {
      background: linear-gradient(160deg, var(--surface-glass), rgba(15, 17, 21, 0.95));
    }

    .flip-front::before {
      content: attr(data-number);
      position: absolute;
      right: 15px;
      bottom: -10px;
      font-size: 6.5rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.04);
      pointer-events: none;
    }

    .legend-role {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      font-weight: 700;
    }

    .flip-back {
      background: linear-gradient(135deg, var(--red-primary), var(--red-deep));
      transform: rotateY(180deg);
      color: #fff;
    }

    .flip-back h4 {
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    /* =========================================
       7. CSS-DRAWN ANFIELD PITCH & TACTICS BOARD
       ========================================= */
    .tactics-wrapper {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 2rem;
      align-items: center;
    }

    @media (max-width: 820px) {
      .tactics-wrapper {
        grid-template-columns: 1fr;
      }
    }

    .tactics-controls {
      background: var(--surface-glass);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .formation-btn {
      width: 100%;
      text-align: left;
      padding: 0.9rem 1rem;
      margin-top: 0.7rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .formation-btn.active, .formation-btn:hover {
      background: var(--red-primary);
      border-color: var(--gold);
      transform: translateX(6px);
    }

    /* Pure CSS Football Pitch */
    .pitch {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 16px;
      border: 3px solid rgba(255, 255, 255, 0.65);
      background: repeating-linear-gradient(
        90deg,
        var(--pitch-green) 0%,
        var(--pitch-green) 10%,
        var(--pitch-stripe) 10%,
        var(--pitch-stripe) 20%
      );
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5), 0 15px 35px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    /* Halfway line */
    .pitch::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: rgba(255, 255, 255, 0.55);
    }

    /* Center Circle */
    .pitch::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90px;
      height: 90px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .player-dot {
      position: absolute;
      transform: translate(-50%, -50%);
      background: var(--red-primary);
